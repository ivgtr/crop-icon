name: Browser verification
on:
  pull_request:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Optional deployed preview URL to test in addition to the local handler
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Use Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive --production=false
      - run: yarn run check
      - run: yarn run playwright install --with-deps chromium
      - name: Browser tests against the production handler
        run: yarn run test:e2e
      - name: Browser tests against the requested deployment
        if: inputs.preview_url != ''
        env:
          E2E_BASE_URL: ${{ inputs.preview_url }}
        run: yarn run test:e2e --output=test-results-preview --reporter=list
      - name: Verify the lockfile was not modified
        run: git diff --exit-code -- yarn.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report
            test-results
            test-results-preview
          retention-days: 7
