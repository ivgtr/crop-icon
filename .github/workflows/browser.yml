name: Browser verification
on:
  pull_request:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Optional deployed preview URL to test in addition to the local handler
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@12.0.2
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm exec -- playwright install --with-deps chromium
      - name: Browser tests against the production handler
        run: npm run test:e2e
      - name: Browser tests against the requested deployment
        if: inputs.preview_url != ''
        env:
          E2E_BASE_URL: ${{ inputs.preview_url }}
        run: npm run test:e2e -- --output=test-results-preview --reporter=list
      - name: Verify the lockfile was not modified
        run: git diff --exit-code -- package-lock.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report
            test-results
            test-results-preview
          retention-days: 7
