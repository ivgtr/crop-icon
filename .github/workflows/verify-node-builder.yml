name: Node builder verification
on:
  push:
    branches: [refactor/crop-icon-maintenance]
    paths: [.github/workflows/verify-node-builder.yml, tsconfig.json]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm install --global npm@12.0.2
      - name: Install the published builder outside the application
        working-directory: ${{ runner.temp }}
        run: npm install --prefix "$RUNNER_TEMP/node-builder-tools" --ignore-scripts --no-audit --no-fund @vercel/node@13.0.0
      - name: Build the single TypeScript entry with the published Node builder
        env:
          DEBUG: '1'
        run: |
          node --input-type=module <<'JS'
          import { createRequire } from 'node:module';
          import { execFileSync } from 'node:child_process';
          import { mkdtempSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const require = createRequire(join(process.env.RUNNER_TEMP, 'node-builder-tools/package.json'));
          const builder = require('@vercel/node');
          const { FileFsRef } = require('@vercel/build-utils');
          const workPath = mkdtempSync(join(process.env.RUNNER_TEMP, 'crop-icon-build-'));
          const files = Object.fromEntries(execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean).map(path => [path, new FileFsRef({ fsPath: join(process.cwd(), path), mode: 0o100644 })]));
          const config = JSON.parse(readFileSync('vercel.json', 'utf8'));
          const result = await builder.build({ files, entrypoint: 'api/index.ts', workPath, config: { ...config.builds[0].config, projectSettings: { nodeVersion: '24.x', installCommand: config.installCommand } }, meta: {} });
          console.log('BUILDER_SUCCEEDED', JSON.stringify({ runtime: result.output?.runtime, handler: result.output?.handler, files: Object.keys(result.output?.files ?? {}), routes: result.routes }));
          JS
