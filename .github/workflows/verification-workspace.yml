name: Browser verification
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Resolve the newly added browser dependency
        run: |
          yarn install --non-interactive --production=false
          echo BEGIN_BROWSER_LOCK
          cat yarn.lock
          echo END_BROWSER_LOCK
      - run: yarn run check
      - run: yarn exec playwright install --with-deps chromium
      - name: Browser tests against the production handler
        run: yarn run test:e2e
      - name: Browser tests against Vercel Preview
        if: always()
        env:
          E2E_BASE_URL: https://crop-icon-git-refactor-crop-icon-studio-ivgtrs-projects.vercel.app
        run: yarn run test:e2e --output=test-results-preview --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            yarn.lock
            playwright-report
            test-results
            test-results-preview
          retention-days: 7
