name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use the pinned npm version
        run: npm install --global npm@12.0.2
      - name: Install the locked dependency tree
        run: npm ci --include=dev
      - run: npm audit
      - name: Build and test all TypeScript sources
        run: npm run check
      - name: Ensure installation did not rewrite the lockfile
        run: git diff --exit-code -- package-lock.json
