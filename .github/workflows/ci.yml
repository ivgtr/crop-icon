name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Use the pinned Yarn Classic version
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = "1.22.22"
      - name: Install the locked dependency tree
        run: yarn install --frozen-lockfile --non-interactive --production=false
      - name: Build and test all TypeScript sources
        run: yarn run check
      - name: Ensure installation did not rewrite the lockfile
        run: git diff --exit-code -- yarn.lock
